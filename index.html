<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#F6F3EA" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="description" content="うちのこ手帳 — ペットの体重・通院・日常を、かわいく・安全に記録する無料アプリ" />
<title>うちのこ手帳</title>


<style>
:root{
  --paper:#F6F3EA;
  --card:#FFFFFF;
  --ink:#2A3328;
  --soft:#7A8472;
  --line:#E6E0D2;
  --green:#4E8B5A;
  --green2:#E3F0E5;
  --yellow:#E8A13A;
  --yellow2:#FFF3DC;
  --red:#E56B58;
  --red2:#FCE9E5;
  --blue:#5A8FBE;
  --blue2:#E4EFF8;
  --shadow:0 5px 0 rgba(42,51,40,.07);
  --shadow-lift:0 10px 28px rgba(42,51,40,.10);
  --r:22px;
  --r-lg:28px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
html{background:#BDB9A8}
body{font-family:'Zen Maru Gothic',system-ui,sans-serif;background:linear-gradient(180deg,#C4C0AE 0%,#B8B4A2 100%);color:var(--ink);display:flex;justify-content:center;min-height:100vh;min-height:100dvh}
.phone{width:100%;max-width:414px;min-height:100vh;min-height:100dvh;background:var(--paper);padding-bottom:128px;position:relative;overflow-x:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.04), 0 20px 60px rgba(0,0,0,.12)}
.num{font-family:'Nunito','Zen Maru Gothic',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

/* header */
.header{padding:calc(48px + env(safe-area-inset-top,0px)) 18px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:1.08rem;font-weight:900;letter-spacing:.04em;line-height:1.15}
.brand span{display:block;font-size:.7rem;color:var(--soft);letter-spacing:.2em;margin-top:3px;font-weight:800}
.pet-btn{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:8px;font-weight:900;box-shadow:var(--shadow);font-size:.88rem;transition:transform .15s ease}
.pet-btn:active{transform:scale(.96)}
.pet-photo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:linear-gradient(145deg,#E8A13A,#F5C978);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.pet-btn.cat .pet-photo{background:linear-gradient(145deg,#8F6BC4,#C2A6E8)}
.pet-btn .chev{font-size:.7rem;color:var(--soft);margin-left:2px}

/* profile */
.profile{margin:8px 16px 0;background:linear-gradient(165deg,#FFFFFF 0%,#FFFBF2 100%);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px 16px 16px;box-shadow:var(--shadow), var(--shadow-lift)}
.profile-top{display:flex;gap:14px;align-items:center}
.avatar{width:78px;height:78px;border-radius:26px;background:linear-gradient(145deg,var(--yellow2),#FFE9B8);display:grid;place-items:center;font-size:40px;border:2.5px solid #F0D59D;position:relative;flex-shrink:0;overflow:hidden;box-shadow:0 4px 12px rgba(232,161,58,.18)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:23px}
.avatar .cam{position:absolute;left:-4px;top:-4px;background:#fff;border:1.5px solid var(--line);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.avatar .mood{position:absolute;right:-6px;bottom:-5px;background:var(--green);color:#fff;font-size:.7rem;font-weight:900;padding:4px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px rgba(78,139,90,.35);letter-spacing:.02em}
.pet-info{flex:1;min-width:0}
.pet-info .label{font-size:.72rem;font-weight:900;color:var(--soft);letter-spacing:.14em}
.pet-info h1{font-size:1.72rem;font-weight:900;margin-top:2px;letter-spacing:-.01em;line-height:1.1}
.pet-info p{font-size:.7rem;font-weight:700;color:var(--soft);margin-top:4px}

.score{margin-top:16px;background:linear-gradient(135deg,var(--green2),#EDF6EE);border-radius:18px;padding:12px 12px 12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(78,139,90,.12)}
.score-text b{font-size:.8rem;font-weight:900}
.score-text span{display:block;font-size:.75rem;color:var(--soft);font-weight:700;margin-top:3px;line-height:1.45}
.score-num{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.28rem;font-weight:900;color:var(--green);box-shadow:inset 0 0 0 5px #E8F3E9, 0 2px 8px rgba(78,139,90,.12);flex-shrink:0;position:relative}
.score-num::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(78,139,90,.2);pointer-events:none}

.share-cta{width:100%;margin-top:12px;background:var(--ink);color:var(--paper);border-radius:16px;padding:13px;font-size:.9rem;font-weight:900;letter-spacing:.02em;box-shadow:0 4px 0 rgba(42,51,40,.2);transition:transform .12s ease,opacity .12s}
.share-cta:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(42,51,40,.2);opacity:.95}

/* dashboard */
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:14px 16px 0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 13px;transition:transform .12s ease}
.card.wide{grid-column:span 2}
.card.tap:active{transform:scale(.985)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-title{font-size:.7rem;font-weight:900;color:var(--soft);display:flex;align-items:center;gap:5px}
.more{font-size:.75rem;font-weight:900;color:var(--green)}
.big{font-size:1.6rem;font-weight:900;line-height:1;letter-spacing:-.02em}
.big small{font-size:.7rem;color:var(--soft);margin-left:2px;font-weight:800}
.note{font-size:.75rem;font-weight:700;color:var(--soft);line-height:1.5;margin-top:6px}
.note b.up{color:var(--red)} .note b.down{color:var(--green)} .note b.same{color:var(--soft)}

.age-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:10px;align-items:center}
.age-circle{width:112px;height:112px;border-radius:50%;margin:auto;display:grid;place-items:center;position:relative;box-shadow:0 4px 14px rgba(232,161,58,.2)}
.age-circle:before{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.age-circle div{position:relative;text-align:center}
.age-circle b{display:block;font-size:1.9rem;font-weight:900;letter-spacing:-.02em}
.age-circle span{display:block;font-size:.72rem;font-weight:900;color:var(--soft);margin-top:1px}
.age-list{display:flex;flex-direction:column;gap:7px}
.mini-row{display:flex;justify-content:space-between;gap:6px;border-bottom:1.5px dotted var(--line);padding-bottom:6px}
.mini-row:last-child{border-bottom:none;padding-bottom:0}
.mini-row span{font-size:.74rem;color:var(--soft);font-weight:800}
.mini-row b{font-size:.78rem;font-weight:900}
.spark{margin-top:9px;width:100%;height:32px;display:block}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:10px;background:#FAF8F0;border-radius:14px;padding:10px 11px;border:1px solid rgba(228,222,204,.6);transition:background .15s}
.task.done{background:#F3F7F3}
.check{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:900;flex-shrink:0;background:#fff;color:transparent;border:2px solid var(--line);transition:.18s ease}
.task.done .check{background:var(--green);color:#fff;border-color:var(--green);transform:scale(1.05)}
.task-text{flex:1;min-width:0}
.task-text b{display:block;font-size:.78rem;font-weight:900;transition:.15s}
.task.done .task-text b{text-decoration:line-through;color:var(--soft)}
.task-text span{font-size:.72rem;color:var(--soft);font-weight:700}
.task-time{font-size:.76rem;font-weight:900;color:var(--yellow)}
.task.done .task-time{color:var(--green)}

/* actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 16px 0}
.action{border-radius:18px;background:#fff;border:1.5px solid var(--line);box-shadow:var(--shadow);padding:11px 4px 9px;color:var(--ink);transition:transform .12s ease}
.action .ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;margin:0 auto 6px;font-size:20px}
.action:nth-child(1) .ico{background:var(--red2)}
.action:nth-child(2) .ico{background:var(--blue2)}
.action:nth-child(3) .ico{background:var(--green2)}
.action:nth-child(4) .ico{background:var(--yellow2)}
.action b{display:block;font-size:.74rem;font-weight:900}
.action:active{transform:scale(.93)}

/* insight */
.insight{margin:14px 16px 0;background:linear-gradient(145deg,#2A3328 0%,#3A4536 100%);color:var(--paper);border-radius:24px;padding:16px 16px 15px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(42,51,40,.25)}
.insight:before{content:"";position:absolute;right:-28px;top:-36px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07)}
.insight:after{content:"";position:absolute;left:-20px;bottom:-30px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.04)}
.insight .ai{display:inline-flex;gap:5px;align-items:center;font-size:.72rem;font-weight:900;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;margin-bottom:9px;letter-spacing:.04em}
.insight h3{font-size:.98rem;font-weight:900;margin-bottom:5px;position:relative}
.insight p{font-size:.72rem;font-weight:700;color:#E6E2D4;line-height:1.6;position:relative}

/* records */
.section{margin:22px 18px 8px;display:flex;align-items:center;justify-content:space-between}
.section h2{font-size:.96rem;font-weight:900}
.section a{font-size:.76rem;font-weight:900;color:var(--green)}
.timeline{margin:0 16px;display:flex;flex-direction:column;gap:9px}
.log{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;gap:11px;box-shadow:0 3px 0 rgba(42,51,40,.05);position:relative;transition:transform .12s}
.log:active{transform:scale(.99)}
.log-ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.log-main{flex:1;min-width:0}
.log-main b{display:block;font-size:.82rem;font-weight:900}
.log-main span{display:block;font-size:.75rem;color:var(--soft);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-size:.74rem;font-weight:900;color:var(--soft);text-align:right;flex-shrink:0}
.date b{display:block;font-size:.82rem;color:var(--ink)}
.timeline .empty{text-align:center;color:var(--soft);font-size:.74rem;font-weight:700;padding:28px 12px;line-height:1.7;background:rgba(255,255,255,.5);border-radius:18px;border:1.5px dashed var(--line)}

/* tip */
.tip{margin:18px 16px 0;border:1.5px dashed #E8C07A;border-radius:var(--r);padding:13px 14px;display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,#FDF8EC,#FFFBF2)}
.tip .emoji{font-size:22px}
.tip p{font-size:.7rem;font-weight:700;line-height:1.55}
.tip p b{color:var(--yellow)}

/* fab + tabbar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:414px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -4px 20px rgba(42,51,40,.06)}
.tab{flex:1;text-align:center;color:var(--soft);font-size:.7rem;font-weight:900;padding:4px 0;border-radius:12px;transition:color .15s}
.tab .i{display:block;font-size:20px;margin-bottom:2px;opacity:.5;transition:opacity .15s,transform .15s}
.tab.on{color:var(--ink)}
.tab.on .i{opacity:1;transform:translateY(-1px)}
.fab{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:5px solid var(--paper);background:linear-gradient(145deg,#2A3328,#3D4A38);color:var(--paper);font-size:30px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(42,51,40,.38), 0 2px 0 rgba(255,255,255,.12) inset;z-index:12;transition:transform .15s ease}
.fab:active{transform:translateX(-50%) scale(.9)}

/* modal sheet */
.overlay{position:fixed;inset:0;background:rgba(28,34,26,.52);z-index:50;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.sheet{width:100%;max-width:414px;background:var(--paper);border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.18);animation:up .28s cubic-bezier(.22,1,.36,1);max-height:92vh;overflow-y:auto}
@keyframes up{from{transform:translateY(100%);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-h b{font-size:1.05rem;font-weight:900}
.sheet-h .x{width:32px;height:32px;border-radius:50%;background:#fff;border:1.5px solid var(--line);font-size:.95rem;font-weight:900;color:var(--soft);display:grid;place-items:center}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.type-btn{border-radius:16px;padding:14px 6px;font-weight:900;font-size:.7rem;color:var(--ink);text-align:center;border:1.5px solid var(--line);background:#fff;box-shadow:var(--shadow);transition:transform .12s}
.type-btn span{display:block;font-size:1.45rem;margin-bottom:4px}
.type-btn:active{transform:scale(.95)}
.field{margin-bottom:13px}
.field label{display:block;font-size:.7rem;font-weight:900;color:var(--soft);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px;font-family:inherit;font-size:1rem;font-weight:700;color:var(--ink)}
.field .row{display:flex;gap:10px;align-items:center}
.field .row input{flex:1}
.field .unit{font-weight:900;color:var(--soft);font-size:.88rem}
.save-btn{width:100%;background:var(--ink);color:var(--paper);border-radius:16px;padding:15px;font-size:1rem;font-weight:900;margin-top:4px;box-shadow:0 4px 0 rgba(42,51,40,.18)}
.save-btn:active{opacity:.88;transform:translateY(1px)}
.pet-list{display:flex;flex-direction:column;gap:9px}
.pet-row{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:11px;box-shadow:var(--shadow)}
.pet-row.active{border-color:var(--green);background:var(--green2);box-shadow:0 0 0 1px rgba(78,139,90,.15)}
.pet-row .pp{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--yellow2);overflow:hidden}
.pet-row .pp img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pet-row .pi{flex:1}
.pet-row .pi b{display:block;font-size:.92rem;font-weight:900}
.pet-row .pi span{font-size:.75rem;color:var(--soft);font-weight:700}
.pet-row .ck{color:var(--green);font-weight:900}
.add-pet{border:2px dashed var(--line);border-radius:16px;padding:13px;text-align:center;font-weight:900;color:var(--soft);font-size:.84rem;width:100%;background:rgba(255,255,255,.5)}
.seg{display:flex;gap:7px;margin-top:2px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:900;font-size:.78rem;color:var(--soft)}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-weight:900;font-size:.84rem;z-index:99;opacity:0;transition:.28s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;bottom:136px}

/* share */
.theme-chips{display:flex;gap:7px;margin-bottom:12px}
.theme-chips button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-weight:900;font-size:.72rem;color:var(--soft)}
.theme-chips button.on{border-color:var(--ink);color:var(--ink);box-shadow:var(--shadow);background:#FFFEF9}
.card-preview{width:100%;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lift);background:#eee;margin-bottom:12px}
.card-preview canvas{width:100%;display:block}
.share-row{display:flex;gap:9px}
.share-row button{flex:1;border-radius:16px;padding:14px;font-size:.9rem;font-weight:900}
.share-row .primary{background:var(--ink);color:var(--paper);box-shadow:0 3px 0 rgba(42,51,40,.18)}
.share-row .ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.share-hint{font-size:.75rem;color:var(--soft);font-weight:700;text-align:center;margin-top:9px;line-height:1.5}

/* reminders */
.rem-list{display:flex;flex-direction:column;gap:9px;margin-bottom:13px}
.rem-row{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:11px;box-shadow:var(--shadow)}
.rem-row.done{opacity:.55}
.rem-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.78rem;font-weight:900;color:transparent;flex-shrink:0}
.rem-row.done .rem-check{background:var(--green);border-color:var(--green);color:#fff}
.rem-info{flex:1;min-width:0}
.rem-info b{display:block;font-size:.88rem;font-weight:900}
.rem-info span{font-size:.76rem;color:var(--soft);font-weight:700}
.rem-days{font-size:.7rem;font-weight:900;color:var(--yellow);flex-shrink:0}
.rem-days.soon{color:var(--red)}
.rem-del{color:var(--soft);font-weight:900;padding:4px 8px;font-size:1rem}
.notif-banner{margin:14px 16px 0;background:var(--blue2);border:1.5px solid #C9DCEC;border-radius:16px;padding:11px 12px;display:flex;align-items:center;gap:9px;font-size:.72rem;font-weight:700;color:var(--ink)}
.notif-banner button{margin-left:auto;background:var(--blue);color:#fff;border-radius:11px;padding:7px 11px;font-size:.7rem;font-weight:900;flex-shrink:0}

/* ===== sub-views ===== */
.view-head{padding:calc(48px + env(safe-area-inset-top,0px)) 18px 4px}
.view-head h1{font-size:1.48rem;font-weight:900;letter-spacing:-.01em}
.view-head p{font-size:.7rem;font-weight:700;color:var(--soft);margin-top:3px}
.view-pet{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font-weight:900;font-size:.78rem;box-shadow:var(--shadow)}
.view-pet .pp{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--yellow2);overflow:hidden}
.view-pet .pp img{width:100%;height:100%;object-fit:cover}

.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:900;font-size:.7rem;color:var(--soft);white-space:nowrap;box-shadow:0 2px 0 rgba(42,51,40,.04)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.rec-day{margin:16px 18px 6px;font-size:.7rem;font-weight:900;color:var(--soft)}
.rec-item{margin:0 16px 8px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:11px;display:flex;align-items:center;gap:11px;box-shadow:0 3px 0 rgba(42,51,40,.05)}
.rec-item .ri{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.rec-item .rm{flex:1;min-width:0}
.rec-item .rm b{display:block;font-size:.82rem;font-weight:900}
.rec-item .rm span{display:block;font-size:.76rem;color:var(--soft);font-weight:700}
.rec-item .rx{color:var(--soft);font-weight:900;padding:6px 8px;font-size:1rem}
.view-empty{text-align:center;color:var(--soft);font-weight:700;font-size:.78rem;padding:56px 28px;line-height:1.7}

.graph-card{margin:6px 16px 0;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:15px}
.graph-card h3{font-size:.78rem;font-weight:900;color:var(--soft);margin-bottom:9px;display:flex;align-items:center;gap:5px}
.gwrap{width:100%;position:relative}
.gwrap svg{width:100%;display:block;overflow:visible}

<script>
"use strict";

/* ---------- storage (works on real device, degrades gracefully in preview) ---------- */
const KEY="uchinoko_v1";
let persistedState=null,storageProblem=null,storedRaw=null;
function save(){
  try{
   if(storageProblem) throw new Error("保存データを復旧してください");
   if(localStorage.getItem(KEY)!==persistedState) throw new Error("別のタブで更新されています。再読み込みしてから操作してください");
   validateState(state); const text=JSON.stringify(state);
   if(text!==persistedState)localStorage.setItem(KEY,text);
   persistedState=text; return true;
  }
  catch(e){ if(persistedState) state=JSON.parse(persistedState); alert("保存できませんでした。変更は保存されていません。容量やブラウザ設定を確認してください。別タブで更新した場合は再読み込みしてください。"); throw e; }
}
function load(){
 try{
  storedRaw=localStorage.getItem(KEY); if(!storedRaw)return null;
  const data=JSON.parse(storedRaw); validateState(data); persistedState=storedRaw; return data;
 }catch(e){storageProblem=e.message; return null;}
}

function esc(v){ return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function validDate(v){return typeof v==="string" && /^\d{4}-\d{2}-\d{2}$/.test(v) && Number.isFinite(Date.parse(v)) && new Date(v).toISOString().slice(0,10)===v;}
function validateState(s){
 const fail=()=>{throw new Error("データ形式が不正です");};
 const str=(v,n=2000)=>typeof v==="string"&&v.length<=n;
 const id=v=>str(v,100)&&/^[a-zA-Z0-9_-]+$/.test(v);
 if(!s||!Array.isArray(s.pets)||s.pets.length>100) fail();
 const ids=new Set();
 for(const p of s.pets){
  if(!p||!id(p.id)||ids.has(p.id)||!str(p.name,100)||!p.name.trim()||!str(p.breed,200)||!str(p.emoji,40)||!str(p.sex,40)||!['dog','cat'].includes(p.species)||!['small','medium','large','cat'].includes(p.size)||!validDate(p.birth)) fail();
  ids.add(p.id);
  if(!Array.isArray(p.records)||p.records.length>50000||!Array.isArray(p.tasks)||p.tasks.length>1000) fail();
  for(const r of p.records) if(!r||!['weight','meal','walk','poop','hospital','vaccine','trim','memo'].includes(r.type)||!validDate(r.date)||!str(r.note)||r.type==='weight'&&!(typeof r.value==='number'&&Number.isFinite(r.value)&&r.value>0&&r.value<=1000)) fail();
  for(const t of p.tasks) if(!t||!str(t.t,200)||!str(t.note)||!str(t.time,100)||typeof t.done!=='boolean') fail();
  if(p.targetWeight!==undefined&&!(typeof p.targetWeight==="number"&&Number.isFinite(p.targetWeight)&&p.targetWeight>0&&p.targetWeight<=1000)) fail();
  if(p.next&&(!str(p.next.title,200)||!validDate(p.next.date)||!str(p.next.place,500))) fail();
  if(p.reminders!==undefined){
   if(!Array.isArray(p.reminders)||p.reminders.length>1000) fail();
   const seen=new Set();
   for(const r of p.reminders){if(!r||!id(r.id)||seen.has(r.id)||!str(r.title,200)||!validDate(r.date)||!str(r.place,500)||typeof r.done!=='boolean') fail();seen.add(r.id);}
  }
 }
 if(s.pets.length?!ids.has(s.activePet):s.activePet!==null) fail();
 if(s.demo!==undefined&&typeof s.demo!=="boolean")fail();
 return s;
}
function validateBackup(data){
 if(!data||data.app!=="uchinoko-techo"||data.schema!==1) throw new Error("対応していないバックアップ形式です");
 validateState(data.state);
 if(!data.photos||typeof data.photos!=="object"||Array.isArray(data.photos)) throw new Error("写真データが不正です");
 for(const [k,v] of Object.entries(data.photos)) if(!data.state.pets.some(p=>p.id===k)||typeof v!=="string"||v.length>5000000||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v)) throw new Error("写真データが不正です");
 return data;
}
function localToday(){const d=new Date();return String(d.getFullYear())+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}


/* ---------- record types ---------- */
const TYPES={
  weight:{label:"体重",ico:"⚖️",bg:"var(--red2)"},
  meal:{label:"ごはん",ico:"🍚",bg:"var(--yellow2)"},
  walk:{label:"お散歩",ico:"🚶",bg:"var(--green2)"},
  poop:{label:"うんち",ico:"💩",bg:"var(--yellow2)"},
  hospital:{label:"通院",ico:"🏥",bg:"var(--blue2)"},
  vaccine:{label:"ワクチン",ico:"💉",bg:"var(--green2)"},
  trim:{label:"トリミング",ico:"✂️",bg:"var(--yellow2)"},
  memo:{label:"メモ",ico:"📝",bg:"var(--blue2)"}
};

/* ---------- seed data ---------- */
function seed(){
  const today=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const back=n=>{const d=new Date(today);d.setDate(d.getDate()-n);return iso(d);};
  const fwd=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return iso(d);};
  return {
    activePet:"p1",
    pets:[
      {
        id:"p1", name:"ハチ", emoji:"🐕", species:"dog", size:"medium",
        sex:"おとこのこ", breed:"柴犬", birth:"2022-04-28",
        next:{title:"狂犬病予防接種", date:fwd(11), place:"さくら動物病院"},
        reminders:[
          {id:"r_h1", title:"狂犬病予防接種", date:fwd(11), place:"さくら動物病院", done:false},
          {id:"r_h2", title:"体重測定", date:fwd(4), place:"", done:false},
          {id:"r_h3", title:"フィラリア薬 7月分", date:fwd(18), place:"", done:false}
        ],
        tasks:[
          {t:"朝ごはん", note:"いつもの量でOK", time:"完了", done:true},
          {t:"お散歩", note:"暑い日は短めでもOK", time:"18:30", done:false},
          {t:"フィラリア薬", note:"ごはん後にあげる", time:"夜", done:false}
        ],
        records:[
          {type:"weight", value:9.4, note:"ごはん後に計測", date:back(3)},
          {type:"weight", value:9.2, note:"", date:back(33)},
          {type:"weight", value:9.1, note:"", date:back(63)},
          {type:"weight", value:9.1, note:"", date:back(93)},

let state=load()||{activePet:null,pets:[]};

/* ---------- helpers ---------- */
function pet(){ return state.pets.find(p=>p.id===state.activePet)||state.pets[0]; }
function daysBetween(a,b){ return Math.floor((new Date(b)-new Date(a))/86400000); }

function humanAge(p){
  const now=new Date();
  const b=new Date(p.birth+"T00:00:00");
  let y=(now-b)/(365.25*86400000);
  if(y<0) y=0;
  if(y<=1) return Math.round(y*15);
  if(y<=2) return Math.round(15+(y-1)*9);
  const per=p.species==="cat"?4:({small:4,medium:5,large:6}[p.size]||5);
  return Math.round(24+(y-2)*per);
}
function actualAge(p){
  const now=new Date(), b=new Date(p.birth+"T00:00:00");
  let months=(now.getFullYear()-b.getFullYear())*12+(now.getMonth()-b.getMonth());
  if(now.getDate()<b.getDate()) months--;
  months=Math.max(0,months);
  const yy=Math.floor(months/12), mm=months%12;
  return {y:yy,m:mm};
}
function jpDate(iso){
  const d=new Date(iso+"T00:00:00"); const w=["日","月","火","水","木","金","土"][d.getDay()];
  return {md:`${d.getMonth()+1}/${d.getDate()}`, w};
}
function weights(p){ return p.records.filter(r=>r.type==="weight").sort((a,b)=>new Date(a.date)-new Date(b.date)); }

/* ---------- sparkline ---------- */
function sparkline(vals,color){
  if(vals.length<2) return `<div style="font-size:.76rem;color:var(--soft);font-weight:700;margin-top:8px">記録を2回以上つけるとグラフが出ます</div>`;
  const w=140,h=34,pad=4;
  const min=Math.min(...vals), max=Math.max(...vals), rng=(max-min)||1;
  const pts=vals.map((v,i)=>{
    const x=pad+(i/(vals.length-1))*(w-pad*2);
    const y=h-pad-((v-min)/rng)*(h-pad*2);
    return [x,y];
  });
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${color}"/>
  </svg>`;
}

/* ---------- condition score (computed, not fake) ---------- */
function conditionScore(p){
  let s=68;
  const today=localToday();
  const recent=p.records.length?Math.min.apply(null,p.records.map(r=>Math.abs(daysBetween(r.date,today)))):999;
  if(recent<=1) s+=15; else if(recent<=3) s+=11; else if(recent<=7) s+=6; else if(recent<=14) s+=1; else s-=7;
  const ws=weights(p);
  if(ws.length>=2){
    const a=ws[ws.length-2].value, b=ws[ws.length-1].value;
    const pct=Math.abs(b-a)/(a||1);
    if(pct<0.03) s+=10; else if(pct<0.07) s+=4; else s-=6;
  }
  if(p.tasks&&p.tasks.length) s+=Math.round((p.tasks.filter(t=>t.done).length/p.tasks.length)*8);
  if((p.reminders||[]).some(r=>!r.done)) s+=2;
  return Math.max(42,Math.min(99,Math.round(s)));
}
function scoreLabel(s){
 if(s>=86) return {mood:"記録充実",word:"記録がそろっています。数値は健康状態の評価ではありません。"};
 if(s>=72) return {mood:"記録継続",word:"最近も記録されています。体調は実際の様子から確認してください。"};
 return {mood:"記録しよう",word:"記録を続けて変化を振り返りましょう。健康状態の良否は判定しません。"};
}

function hitokoto(p,ctx){
  const name=p.name, t=localToday(), md=t.slice(5);
  if(p.birth&&p.birth.slice(5)===md){ const a=actualAge(p); return {main:`お誕生日おめでとう！ ${name}は今日で${a.y}歳になりました。`,sub:"今日の様子を、ひとことメモに残しておきませんか。"}; }
  const lines=[
    `${name}が生まれて${ctx.together.toLocaleString()}日目。今日もそばにいてくれて、ありがとう。`,
    `${name}の小さな変化に気づけるのは、毎日いっしょにいるあなたです。`,
    `今日の${name}は、どんな顔をしていましたか？ ひとことメモに残してみよう。`,
    `記録は${p.records.length}件になりました。${name}との毎日が、少しずつ手帳に積み重なっています。`,
    `お世話おつかれさま。${name}との時間が、今日もおだやかでありますように。`
  ];
  const day=Math.floor(Date.parse(t+"T00:00:00Z")/86400000);
  const main=lines[((day%lines.length)+lines.length)%lines.length];
  let sub="";
  if(ctx.dcls==="up") sub=`体重は前回より ${ctx.delta}。測った時間や条件も、いっしょに振り返ってみよう。`;
  else if(ctx.dcls==="down") sub=`体重は前回より ${ctx.delta}。測った時間や条件も、いっしょに振り返ってみよう。`;
  else if(ctx.total&&ctx.done===ctx.total) sub="今日のお世話チェックは、ぜんぶ完了しています。";
  else if(ctx.total) sub=`お世話チェックは、あと${ctx.total-ctx.done}件です。`;
  else sub="体重・ごはん・お通じをこまめに残すと、小さな変化にも気づきやすくなります。";
  return {main,sub};
}

  const fwd=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};

/* ---------------- SHARE CARD ---------------- */
const THEMES={
  cream:{name:"くりーむ", bg:"#F4F1E5", panel:"#FFFFFF", panel2:"#FFFCF3", accent:"#E7A33E", ink:"#2F3B2D", soft:"#8A9080", band:"#FBEFD6", spark:"#E97863"},
  night:{name:"よぞら", bg:"#243039", panel:"#2E3B45", panel2:"#33424D", accent:"#7FB0DF", ink:"#F1EFE6", soft:"#9FB2BE", band:"#3A4B57", spark:"#F0A48E"},
  sakura:{name:"さくら", bg:"#F7E7EC", panel:"#FFFFFF", panel2:"#FFF6F8", accent:"#E97F9A", ink:"#4A2F38", soft:"#A98894", band:"#FCE4EA", spark:"#E97863"}
};
let _theme="cream";

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

async function buildCard(theme){
  const t=THEMES[theme]||THEMES.cream;
  const p=pet();
  const ha=humanAge(p), aa=actualAge(p);
  const together=daysBetween(p.birth,new Date());
  const ws=weights(p);
  const latest=ws.length?ws[ws.length-1].value:null;

  const c=document.createElement("canvas");
  c.width=1080; c.height=1350;
  const x=c.getContext("2d");
  try{ await document.fonts.ready; }catch(e){}

  // bg
  x.fillStyle=t.bg; x.fillRect(0,0,1080,1350);

  // panel (techo page)
  x.save();
  x.shadowColor="rgba(0,0,0,.12)"; x.shadowBlur=40; x.shadowOffsetY=18;
  const g=x.createLinearGradient(0,80,0,1270);
  g.addColorStop(0,t.panel); g.addColorStop(1,t.panel2);
  x.fillStyle=g; roundRect(x,70,80,940,1190,54); x.fill();
  x.restore();

  const cx=540;
  const center=(txt,y,font,color,ls)=>{
    x.font=font; x.fillStyle=color; x.textAlign="center"; x.textBaseline="alphabetic";
    x.fillText(txt,cx,y);
  };

  // brand
  center("うちのこ手帳",190,'900 40px "Zen Maru Gothic"',t.ink);
  center("U C H I N O K O   T E C H O",232,'800 22px "Nunito"',t.soft);

  // emoji circle
  x.save();
  x.beginPath(); x.arc(cx,400,120,0,Math.PI*2); x.fillStyle=t.band; x.fill();
  x.restore();
  if(photos[p.id]){
    await new Promise(r=>{
      const im=new Image();
      im.onload=()=>{ x.save(); x.beginPath(); x.arc(cx,400,120,0,Math.PI*2); x.clip(); x.drawImage(im,cx-120,280,240,240); x.restore(); r(); };
      im.onerror=r; im.src=photos[p.id];
    });
  }else{
    x.save();
    x.font='150px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
    x.textAlign="center"; x.textBaseline="middle";
    x.fillText(p.emoji,cx,412);
    x.restore();
  }

  // name + meta
  center(p.name,600,'900 78px "Zen Maru Gothic"',t.ink);
  center(`${p.breed}・${p.sex}・${aa.y}歳${aa.m}ヶ月`,652,'700 32px "Zen Maru Gothic"',t.soft);

  // hero band: 一緒に◯日
  x.save();
  roundRect(x,140,710,800,220,40); x.fillStyle=t.band; x.fill();
  x.restore();
  center("生まれてから",775,'800 30px "Zen Maru Gothic"',t.soft);
  x.textAlign="center";
  x.font='900 128px "Nunito"'; x.fillStyle=t.accent;
  const dayStr=together.toLocaleString();
  x.fillText(dayStr,cx-40,905);
  // "日" suffix
  const w1=x.measureText(dayStr).width;
  x.font='900 44px "Zen Maru Gothic"'; x.fillStyle=t.ink;
  x.textAlign="left";
  x.fillText("日",cx-40+w1/2+14,905);

  // two mini stats
  const miniY=970, miniH=200;
  const drawMini=(mx,label,val,unit)=>{
    x.save();
    roundRect(x,mx,miniY,380,miniH,36);
    x.fillStyle=t.panel; x.lineWidth=3; x.strokeStyle=t.band; x.fill(); x.stroke();
    x.restore();
    x.textAlign="center";
    x.font='800 28px "Zen Maru Gothic"'; x.fillStyle=t.soft;
    x.fillText(label,mx+190,miniY+58);
    x.font='900 72px "Nunito"'; x.fillStyle=t.ink;
    x.textAlign="center"; x.textBaseline="alphabetic";
    const vt=String(val);
    x.fillText(vt,mx+190-(unit?18:0),miniY+150);
    if(unit){
      const vw=x.measureText(vt).width;
      x.font='900 30px "Zen Maru Gothic"'; x.fillStyle=t.soft; x.textAlign="left";
      x.fillText(unit,mx+190-18+vw/2+8,miniY+150);
    }
  };
  drawMini(140,"にんげん年齢",ha,"歳");
  drawMini(560,"いまの体重",latest!=null?latest:"—","kg");

  // weight sparkline band
  if(ws.length>=2){
    const bx=140,by=1200,bw=800,bh=0; // baseline for line inside footer area
    const vals=ws.map(w=>w.value);
    const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
    const gx0=180,gx1=900,gy0=1210,gy1=1150;
    x.beginPath();
    vals.forEach((v,i)=>{
      const px=gx0+(i/(vals.length-1))*(gx1-gx0);
      const py=gy0-((v-min)/rng)*(gy0-gy1);
      i?x.lineTo(px,py):x.moveTo(px,py);
    });
    x.strokeStyle=t.spark; x.lineWidth=6; x.lineCap="round"; x.lineJoin="round"; x.stroke();
    const lx=gx1, ly=gy0-((vals[vals.length-1]-min)/rng)*(gy0-gy1);
    x.beginPath(); x.arc(lx,ly,9,0,Math.PI*2); x.fillStyle=t.spark; x.fill();
  }

  // footer hashtag
  center("🐾  #うちのこ手帳",1235,'900 34px "Zen Maru Gothic"',t.accent);

  return c;
}

let _card=null;
async function refreshPreview(){
  _card=await buildCard(_theme);
  const box=document.getElementById("cardPreview");
  if(!box) return;
  box.innerHTML="";
  const view=document.createElement("canvas");
  view.width=_card.width; view.height=_card.height;
  view.getContext("2d").drawImage(_card,0,0);
  box.appendChild(view);
}

function cardBlob(){
  return new Promise(res=>{
    if(_card.toBlob) _card.toBlob(b=>res(b),"image/png");
    else { // fallback
      const d=_card.toDataURL("image/png"); const bin=atob(d.split(",")[1]);
      const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
      res(new Blob([arr],{type:"image/png"}));
    }
  });
}

async function doShare(){
  try{
    const blob=await cardBlob();
    const file=new File([blob],`${pet().name}_うちのこ手帳.png`,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text:`${pet().name}が生まれて${daysBetween(pet().birth,new Date()).toLocaleString()}日 🐾 #うちのこ手帳`});
      toast("シェアしました 🐾");
    }else{
      doSave(); // fallback to save if share unsupported
    }
  }catch(e){ if(String(e).indexOf("Abort")<0) toast("シェアをキャンセルしました"); }
}

async function doSave(){
  const blob=await cardBlob();
  const url=URL.createObjectURL(blob);
  const w=window.open(url,"_blank");
  if(!w){ // popup blocked: swap preview for a saveable full image
    const a=document.createElement("a"); a.href=url; a.download=`${pet().name}_うちのこ手帳.png`; a.click();
  }
  toast("画像を長押しで保存できます");
}

/* ---------------- PHOTOS (IndexedDB) ---------------- */
let photos={};
const MEDIA_DB="uchinoko_media", MEDIA_STORE="photos";
function mediaDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open(MEDIA_DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(MEDIA_STORE);
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){
 const db=await mediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,"readwrite");tx.objectStore(MEDIA_STORE).put(v,k);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=tx.onabort=()=>{db.close();reject(tx.error||new Error("写真保存失敗"));};});
}
async function idbAll(){
 const db=await mediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,"readonly"),out={};const rq=tx.objectStore(MEDIA_STORE).openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue();}};tx.oncomplete=()=>{db.close();resolve(out);};tx.onerror=tx.onabort=()=>{db.close();reject(tx.error||new Error("写真読み込み失敗"));};});
}
async function idbDel(k){
 const db=await mediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,"readwrite");tx.objectStore(MEDIA_STORE).delete(k);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=tx.onabort=()=>{db.close();reject(tx.error||new Error("写真削除失敗"));};});
}

function compressImage(file,max=800,q=0.82){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const side=Math.min(img.width,img.height);
      const sx=(img.width-side)/2, sy=(img.height-side)/2;
      const out=Math.min(side,max);
      const c=document.createElement("canvas"); c.width=out; c.height=out;
      c.getContext("2d").drawImage(img,sx,sy,side,side,0,0,out,out);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",q));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};
    img.src=url;
  });
}
function pickPhoto(){
  const ownerId=pet().id;
  const inp=document.getElementById("photoInput");
  inp.value="";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    if(!f.type.startsWith("image/")||f.size>20*1024*1024){toast("20MB以下の画像を選んでください");return;}
    toast("写真を処理中…");
    try{
      const d=await compressImage(f);
      const id=ownerId;
      if(!state.pets.some(p=>p.id===id)){toast("対象のペットが削除されました");return;}
      await idbSet(id,d);
      photos[id]=d;
      render();
      toast("写真を設定しました 📷");
    }
    catch(e){ toast("写真の読み込みに失敗"); }
  };
  inp.click();
}

/* ---------------- REMINDERS ---------------- */
function openReminderSheet(){
  const p=pet();
  const rs=[...(p.reminders||[])].sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    return new Date(a.date)-new Date(b.date);
  });
  const todayISO=localToday();
  const rows=rs.length?rs.map(r=>{
    const d=daysBetween(todayISO,r.date);
    const dl=r.done?"完了":(d<0?`${-d}日前`:d===0?"今日":`${d}日後`);
    return `<div class="rem-row ${r.done?'done':''}">
      <div class="rem-check" onclick="toggleRem('${r.id}')">✓</div>
      <div class="rem-info"><b>${esc(r.title)}</b><span>${jpDate(r.date).md}（${jpDate(r.date).w}）${esc(r.place?' ・'+r.place:'')}</span></div>
      <div class="rem-days ${!r.done&&d<=3?'soon':''}">${dl}</div>
      <button class="rem-del" onclick="delRem('${r.id}')">✕</button>
    </div>`;
  }).join(""):`<div style="text-align:center;color:var(--soft);font-weight:700;font-size:.8rem;padding:16px 0">まだ予定がありません</div>`;
  const today=localToday();
  openSheet(`
    <div class="sheet-h"><b>🔔 ${esc(p.name)}の予定</b><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="rem-list">${rows}</div>
    <div class="field"><label>予定を追加</label><input id="r_title" maxlength="200" type="text" placeholder="狂犬病予防接種・通院 など"></div>
    <div class="field"><label>日付</label><input id="r_date" type="date" value="${today}"></div>
    <div class="field"><label>場所（任意）</label><input id="r_place" maxlength="500" type="text" placeholder="◯◯動物病院"></div>
    <button class="save-btn" onclick="addRem()">予定を追加</button>`);
}
function toggleRem(id){ const p=pet(); const r=(p.reminders||[]).find(r=>r.id===id); if(r){ r.done=!r.done; save(); openReminderSheet(); render(); } }
function delRem(id){ if(!confirm("この予定を削除しますか？"))return; const p=pet(); p.reminders=(p.reminders||[]).filter(r=>r.id!==id); save(); openReminderSheet(); render(); toast("削除しました"); }
async function addRem(){
  if(!document.getElementById("overlay").classList.contains("show"))return;
  const title=(document.getElementById("r_title").value||"").trim();
  if(!title){ toast("予定名を入れてね"); return; }
  const date=document.getElementById("r_date").value||localToday();
  const place=(document.getElementById("r_place").value||"").trim();
  if(!validDate(date)||title.length>200||place.length>500){toast("日付と入力内容を確認してください");return;}
  const r={id:"r"+crypto.randomUUID().replaceAll("-",""),title,date,place,done:false};
  pet().reminders=pet().reminders||[]; pet().reminders.push(r);
  save();
  await scheduleReminder(r);
  sheetDirty=false; closeSheet(true); render(); toast("予定を追加しました 🔔");
}

/* ---------------- NOTIFICATIONS (Capacitor-ready) ---------------- */
let notifState=("Notification" in window)?Notification.permission:"unsupported";
function hashId(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h%2000000000; }
async function ensureNotify(){
  try{
    const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
    if(LN){ const p=await LN.requestPermissions(); notifState=(p&&p.display==="granted")?"granted":"denied"; return; }
  }catch(e){}
  if("Notification" in window){
    if(Notification.permission==="default"){ try{ await Notification.requestPermission(); }catch(e){} }
    notifState=Notification.permission;
  }
}
async function scheduleReminder(r){
  // Real scheduled local notification in the native (Capacitor) build
  try{
    const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
    if(LN){
      await LN.schedule({notifications:[{
        id:hashId(r.id), title:"うちのこ手帳 🐾",
        body:`${pet().name}：${r.title}`,
        schedule:{at:new Date(r.date+"T09:00:00")}
      }]});
    }
  }catch(e){}
}
function checkDue(){
  const todayISO=localToday();
  const soon=[];
  state.pets.forEach(p=>(p.reminders||[]).filter(r=>!r.done).forEach(r=>{
    const d=daysBetween(todayISO,r.date);
    if(d>=0&&d<=3) soon.push({name:p.name,title:r.title,d});
  }));
  if(!soon.length) return;
  soon.sort((a,b)=>a.d-b.d);
  const s=soon[0];
  const when=s.d===0?"今日":`${s.d}日後`;
  setTimeout(()=>toast(`${s.name}：${s.title} は${when} 🔔`),900);
  if("Notification" in window && Notification.permission==="granted"){
    try{ new Notification("うちのこ手帳 🐾",{body:`${s.name}：${s.title}（${when}）`}); }catch(e){}
  }
}

/* ---------------- RECORDS VIEW ---------------- */
let recFilter="all",recQuery="";
function renderRecords(){
  const p=pet();
  const present=Object.keys(TYPES).filter(t=>p.records.some(r=>r.type===t));
  if(recFilter!=="all" && present.indexOf(recFilter)<0) recFilter="all";
  const list=[...p.records].filter(r=>(recFilter==="all"||r.type===recFilter)&&(!recQuery||(TYPES[r.type].label+" "+r.note+" "+r.date+" "+(r.value??"")).toLowerCase().includes(recQuery.toLowerCase())))
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  let rows="", lastKey="";
  list.forEach(r=>{
    const d=new Date(r.date+"T00:00:00"), key=d.getFullYear()+"/"+(d.getMonth()+1);
    if(key!==lastKey){ rows+=`<h2 class="rec-day">${d.getFullYear()}年${d.getMonth()+1}月</h2>`; lastKey=key; }
    const T=TYPES[r.type], dd=jpDate(r.date), gi=p.records.indexOf(r);
    const main=r.type==="weight"?`体重 ${r.value}kg`:T.label;
    rows+=`<button class="rec-item" data-recedit="${gi}" aria-label="${dd.md}（${dd.w}） ${esc(T.label)}${r.type==="weight"?" "+r.value+"kg":""} ${esc(r.note)}。タップで編集、長押しでメニュー">
      <span class="rd"><b class="num">${d.getDate()}</b><span>${dd.w}</span></span>

    </div>
    ${list.length?`<p class="rec-hint">タップで編集 ・ 長押しで削除などのメニュー</p>`+rows:empty}`;
  document.getElementById("vpBtn").onclick=petSheet;
  document.getElementById("searchForm").onsubmit=e=>{e.preventDefault();recQuery=document.getElementById("recordSearch").value.trim();render();};
  document.querySelectorAll("#recChips .chip").forEach(b=>b.onclick=()=>{ recFilter=b.dataset.f; render(); });
  document.querySelectorAll("[data-recedit]").forEach(el=>{
    const i=+el.dataset.recedit; let timer=null, sx=0, sy=0, longed=false;
    const cancel=()=>{ clearTimeout(timer); timer=null; el.classList.remove("pressing"); };
    el.addEventListener("pointerdown",e=>{ longed=false; sx=e.clientX; sy=e.clientY; el.classList.add("pressing"); timer=setTimeout(()=>{ longed=true; cancel(); if(navigator.vibrate)try{navigator.vibrate(10);}catch(_){} recordMenu(i); },550); });
    el.addEventListener("pointermove",e=>{ if(timer&&(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)) cancel(); });
    ["pointerup","pointercancel","pointerleave"].forEach(t=>el.addEventListener(t,cancel));
    el.addEventListener("contextmenu",e=>{ e.preventDefault(); if(!longed){ longed=true; cancel(); recordMenu(i); } });
    el.onclick=e=>{ if(longed){ e.preventDefault(); longed=false; return; } editRecord(i); };
  });

/* ---------------- GRAPH VIEW ---------------- */
let gPeriod="all";
function niceTicks(lo,hi){
  const steps=[0.1,0.2,0.25,0.5,1,2,2.5,5,10,20,25,50,100];
  let rng=hi-lo; if(rng<=0) rng=Math.max(0.2,Math.abs(hi)*0.05);
  const step=steps.find(s=>rng/s<=4)||100;
  let a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step; if(b-a<step){a-=step;b+=step;}
  const dec=step<1?String(step).split(".")[1].length:0, ticks=[];
  for(let v=a; v<=b+1e-9; v+=step) ticks.push(+v.toFixed(dec));
  return {a:+a.toFixed(dec),b:+b.toFixed(dec),ticks,dec};
}
function weightGraphSVG(ws,target){
  if(ws.length<2) return `<div class="view-empty" style="padding:38px 20px">体重を2回以上記録すると<br>グラフが表示されます</div>`;
  const W=360,H=200,padL=38,padR=14,padT=14,padB=28;
  const vals=ws.map(w=>w.value);
  const lo=Math.min(...vals,target??Infinity), hi=Math.max(...vals,target??-Infinity);
  const nt=niceTicks(lo,hi), iw=W-padL-padR, ih=H-padT-padB;
  const tm=ws.map(w=>Date.parse(w.date+"T00:00:00Z")), t0=tm[0], t1=tm[tm.length-1];
  const X=i=>padL+(t1>t0?(tm[i]-t0)/(t1-t0):i/(ws.length-1))*iw;
  const Y=v=>padT+(1-(v-nt.a)/(nt.b-nt.a))*ih;
  let grid="";
  nt.ticks.forEach(v=>{ const gy=Y(v);
    grid+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${(gy+3.5).toFixed(1)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--soft)">${v.toFixed(nt.dec)}</text>`; });
  let goal="";
  if(target!=null){ const gy=Y(target).toFixed(1); goal=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--green)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${W-padR}" y="${(Y(target)-5).toFixed(1)}" text-anchor="end" font-size="11" font-weight="800" fill="var(--green)">目標 ${target}kg</text>`; }
  const line=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=`M${X(0).toFixed(1)} ${(padT+ih).toFixed(1)} `+vals.map((v,i)=>`L${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ')+` L${X(vals.length-1).toFixed(1)} ${(padT+ih).toFixed(1)} Z`;
  const dots=vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.5" fill="#fff" stroke="var(--red)" stroke-width="2.5"><title>${jpDate(ws[i].date).md} ${v}kg</title></circle>`).join('');
  const idx=[0,ws.length-1]; const mid=Math.floor((ws.length-1)/2); if(ws.length>2&&X(mid)-X(0)>60&&X(ws.length-1)-X(mid)>60) idx.splice(1,0,mid);
  const xlab=idx.map((i,k)=>`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="${k===0?'start':k===idx.length-1?'end':'middle'}" font-size="11" font-weight="700" fill="var(--soft)">${jpDate(ws[i].date).md}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="体重の推移。${jpDate(ws[0].date).md}の${vals[0]}kgから${jpDate(ws[ws.length-1].date).md}の${vals[vals.length-1]}kgまで${ws.length}回">${grid}${goal}<path d="${area}" fill="rgba(233,120,99,.12)"/><path d="${line}" fill="none" stroke="var(--red)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xlab}</svg>`;
}
function signedKg(v){ return v==null?"—":(v>0?"+":v<0?"":"±")+v+"kg"; }
function renderGraph(){
  const p=pet();
  const all=weights(p);
  let ws=all;
  if(gPeriod!=="all"){
    const days=gPeriod==="3m"?92:366;
    const cut=new Date(); cut.setDate(cut.getDate()-days);
    ws=ws.filter(w=>new Date(w.date+"T00:00:00")>=cut);
  }
  const vals=ws.map(w=>w.value);
  const latest=vals.length?vals[vals.length-1]:null;
  const max=vals.length?Math.max.apply(null,vals):null;
  const min=vals.length?Math.min.apply(null,vals):null;
  const change=vals.length>=2?+(vals[vals.length-1]-vals[0]).toFixed(1):null;
  const recent=all.length>=2?+(all[all.length-1].value-all[all.length-2].value).toFixed(1):null;
  const tw=p.targetWeight;
  const lastAll=all.length?all[all.length-1].value:null;
  const toGoal=(tw!=null&&lastAll!=null)?+(lastAll-tw).toFixed(1):null;
  const cls=v=>v>0?"up":v<0?"down":"";
  const periodName={"3m":"3ヶ月","1y":"1年","all":"全期間"}[gPeriod];
  const typeCounts=Object.keys(TYPES).map(t=>({t,n:p.records.filter(r=>r.type===t).length})).filter(o=>o.n>0).sort((a,b)=>b.n-a.n);
  const totalRec=typeCounts.reduce((a,o)=>a+o.n,0);
  document.getElementById("app").innerHTML=`
    <div class="view-head"><h1>📈 グラフ</h1><p>${esc(p.name)}の体重推移</p>
      <button class="view-pet" id="vpBtn"><span class="pp">${photos[p.id]?`<img src="${photos[p.id]}">`:esc(p.emoji)}</span>${esc(p.name)} ▼</button></div>
    <div class="period" id="gPeriod" role="group" aria-label="期間">
      ${[["3m","3ヶ月"],["1y","1年"],["all","全期間"]].map(([k,l])=>`<button class="${gPeriod===k?'on':''}" data-p="${k}" aria-pressed="${gPeriod===k}">${l}</button>`).join("")}
    </div>
    <section class="g-summary" aria-label="この期間の増減">
      <span>この期間（${periodName}）の増減</span>
      <b class="num ${cls(change)}">${signedKg(change)}</b>
      <small>${vals.length>=2?`${jpDate(ws[0].date).md} ${vals[0]}kg → ${jpDate(ws[ws.length-1].date).md} ${latest}kg ・ ${vals.length}回の記録`:(vals.length?"この期間の記録は1回です":"この期間の体重記録はありません")}</small>
    </section>
    <div class="graph-card"><h3>⚖️ 体重の推移（kg）</h3>
      <div class="g-chips">
        <span class="g-chip">直近の変化 <b class="${cls(recent)}">${recent==null?'—':signedKg(recent)}</b></span>
        <button class="g-chip" id="targetBtn">🎯 目標 <b>${tw!=null?tw+'kg':'未設定'}</b>${toGoal!=null?` <small>${Math.abs(toGoal)<0.05?'達成':'あと'+Math.abs(toGoal)+'kg'}</small>`:''}</button>
      </div>
      <div class="gwrap">${weightGraphSVG(ws,tw)}</div></div>
    <div class="stat-grid">
      <div class="stat"><b class="num">${latest!=null?latest:'—'}</b><span>最新 kg</span></div>
      <div class="stat"><b class="num">${max!=null?max:'—'}</b><span>最大 kg</span></div>
      <div class="stat"><b class="num">${min!=null?min:'—'}</b><span>最小 kg</span></div>
    </div>
    <details class="breakdown"><summary>📊 記録の内訳（全${totalRec}件）</summary>
      <div class="type-stats">
        ${typeCounts.length?typeCounts.map(o=>`<div class="type-stat"><span class="e">${TYPES[o.t].ico}</span><b>${TYPES[o.t].label}</b><span class="c num">${o.n}</span></div>`).join(""):'<div style="padding:16px 0;text-align:center;color:var(--soft);font-weight:700;font-size:.8rem">記録がありません</div>'}
      </div>
    </details>`;
  document.getElementById("vpBtn").onclick=petSheet;
  document.getElementById("targetBtn").onclick=targetSheet;
  document.querySelectorAll("#gPeriod button").forEach(b=>b.onclick=()=>{ gPeriod=b.dataset.p; render(); });
}
function targetSheet(){
  const p=pet();
  openSheet(`<div class="sheet-h"><b>🎯 目標体重</b><button class="x" onclick="closeSheet()" aria-label="閉じる">✕</button></div>
    <div class="field"><label>目標体重（kg）</label><div class="row"><input id="t_val" type="number" inputmode="decimal" step="0.1" min="0.1" max="1000" placeholder="例：9.0" value="${p.targetWeight??''}"><span class="unit">kg</span></div></div>

function deletePet(id){

  if(state.activePet===id) state.activePet=state.pets[0]?.id||null;
  render(); idbDel(id).catch(()=>toast("プロフィールは削除しましたが、端末内の写真削除に失敗しました")); delete photos[id]; toast("削除しました");
}

  toast("バックアップを作成中…");
  let ph; try{ ph=await idbAll(); }catch(e){ toast("写真を取得できないため書き出しを中止しました"); return; }
  ph=Object.fromEntries(Object.entries(ph).filter(([k])=>state.pets.some(p=>p.id===k)));
  const payload={app:"uchinoko-techo",schema:1,exportedAt:new Date().toISOString(),state:state,photos:ph};
  try{validateBackup(payload);}catch(e){toast("データを検証できないため書き出しを中止しました");return;}
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const fname="うちのこ手帳_backup_"+localToday()+".json";
  try{
    const file=new File([blob],fname,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"うちのこ手帳バックアップ"});
      toast("バックアップを書き出しました 📤"); return;
    }
  }catch(e){ if(String(e).indexOf("Abort")>=0) return; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast("バックアップを保存しました 📤");
}
async function exportRecovery(){
 try{
  const all=await idbAll(); const data=all.__restore_recovery__;
  if(!data){toast("復元前の退避データはありません");return;}
  validateBackup(data);
  const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download="uchinoko_before_restore.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);
 }catch(e){toast("退避データを取得できませんでした");}
}
async function replacePhotos(values){
 const db=await mediaDB();
 return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,"readwrite");const st=tx.objectStore(MEDIA_STORE);st.clear();for(const [k,v] of Object.entries(values)) st.put(v,k);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=tx.onabort=()=>{db.close();reject(tx.error||new Error("写真保存失敗"));};});
}
function triggerImport(){
 const inp=document.getElementById("importInput"); inp.value="";
 inp.onchange=async()=>{
  const f=inp.files&&inp.files[0]; if(!f)return;
  let previous,previousPhotos,previousRaw,previousProblem,committing=false;
  try{
   if(f.size>25*1024*1024) throw new Error("ファイルは25MB以下にしてください");
   const data=validateBackup(JSON.parse(await f.text()));
   if(!confirm(data.state.pets.length+"匹のデータで現在の記録と写真を置き換えます。復元前のデータも端末内に退避します。続けますか？"))return;
   if(!storageProblem&&localStorage.getItem(KEY)!==persistedState)throw new Error("別タブで更新されました。再読み込みしてください");
   previousRaw=localStorage.getItem(KEY);previousProblem=storageProblem;
   previous=JSON.parse(JSON.stringify(state)); previousPhotos=Object.fromEntries(Object.entries(await idbAll()).filter(([k])=>previous.pets.some(p=>p.id===k)));
   await idbSet("__restore_recovery__",{app:"uchinoko-techo",schema:1,exportedAt:new Date().toISOString(),state:previous,photos:previousPhotos});
   await idbSet("__restore_pending__",{state:previous,photos:previousPhotos,raw:localStorage.getItem(KEY),problem:storageProblem});
   committing=true;
   await replacePhotos({...data.photos,__restore_pending__:{state:previous,photos:previousPhotos,raw:localStorage.getItem(KEY),problem:storageProblem},__restore_recovery__:{app:"uchinoko-techo",schema:1,exportedAt:new Date().toISOString(),state:previous,photos:previousPhotos}});
   localStorage.setItem(KEY,JSON.stringify(data.state));
   state=data.state; persistedState=JSON.stringify(state); storedRaw=persistedState; storageProblem=null; photos=data.photos;
   await idbDel("__restore_pending__");
   state.pets.forEach(p=>{if(!p.reminders)p.reminders=p.next?[{id:"legacy_"+p.id,...p.next,done:false}]:[];});
   setView("home"); toast("復元しました 🐾");
  }catch(e){
   if(committing){try{
    await replacePhotos({...previousPhotos,__restore_recovery__:{app:"uchinoko-techo",schema:1,exportedAt:new Date().toISOString(),state:previous,photos:previousPhotos}});
    state=previous;photos=previousPhotos;
    if(previousRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,previousRaw);
    storageProblem=previousProblem;persistedState=previousProblem?null:previousRaw;
    render();
   }catch(rollback){storageProblem="復元処理の復旧が必要です";renderRecovery();alert("復旧できませんでした。元データの救出またはお手元のバックアップを確認してください。");}}

   toast("復元を中止しました："+e.message);
  }
 };
 inp.click();
}



function taskRow(t={t:"",note:"",time:"",done:false}){
 return `<div class="task-edit-row" data-done="${t.done?'1':'0'}" style="border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0"><label>お世話の名前<input class="task-title" aria-label="お世話の名前" maxlength="200" value="${esc(t.t)}"></label><label>メモ<input class="task-note" aria-label="お世話のメモ" maxlength="2000" value="${esc(t.note)}"></label><label>時間の目安<input class="task-time-input" aria-label="時間の目安" maxlength="100" value="${esc(t.time)}"></label><button class="mini" onclick="this.closest('.task-edit-row').remove();sheetDirty=true">この項目を外す</button></div>`;
}
function taskEditor(){openSheet(`<div class="sheet-h"><b>お世話チェックを編集</b><button class="x" onclick="closeSheet()">✕</button></div><p class="small-note">ごはん、トイレのお手入れなど。完了状態は手動で切り替えます。</p><div id="taskRows">${pet().tasks.map(taskRow).join('')}</div><button class="secondary" onclick="appendTaskRow()">＋ お世話項目を追加</button><button class="save-btn" onclick="saveTasks()">保存する</button>`);}
function appendTaskRow(){if(document.querySelectorAll('.task-edit-row').length>=100){toast("項目は100件までです");return;}document.getElementById('taskRows').insertAdjacentHTML('beforeend',taskRow());sheetDirty=true;}
function saveTasks(){
 const tasks=[...document.querySelectorAll('.task-edit-row')].map(el=>({t:el.querySelector('.task-title').value.trim(),note:el.querySelector('.task-note').value.trim(),time:el.querySelector('.task-time-input').value.trim(),done:el.dataset.done==='1'}));
 if(tasks.some(t=>!t.t)){toast("お世話の名前を入力してください");return;}
 pet().tasks=tasks;render();closeSheet(true);toast("お世話項目を保存しました");
}

function downloadText(text,name){const u=URL.createObjectURL(new Blob([text],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
function renderRecovery(){
 document.getElementById("fab").hidden=true;
 document.getElementById("app").innerHTML=`<section class="welcome"><div class="welcome-mark">🛟</div><p class="eyebrow">データを守るための確認</p><h1>保存データを確認しましょう</h1><p>${esc(storageProblem)}</p><p>この画面では元の記録を自動で上書きしません。</p><button class="save-btn" onclick="location.reload()">再読み込み</button><button class="secondary" onclick="downloadRaw()">元データをファイルに退避</button><button class="secondary" onclick="triggerImport()">バックアップから復元</button><button class="secondary" onclick="exportRecovery()">復元前の退避データを書き出す</button></section>`;
}
async function downloadRaw(){try{const all=await idbAll();downloadText(JSON.stringify({rescue:true,raw:localStorage.getItem(KEY),media:all}),"uchinoko_rescue.json");toast("救出ファイルの保存先を確認してください");}catch(e){if(storedRaw!==null)downloadText(storedRaw,"uchinoko_raw.json");else toast("データにアクセスできませんでした");}}
function renderWelcome(){
 document.getElementById("app").innerHTML=`<section class="welcome"><div class="welcome-mark">🐾</div><p class="eyebrow">UCHINOKO TECHO</p><h1>いつもの毎日が、<br>大切な記録になる。</h1><p>ごはんも、体重も、通院のことも。<br>うちのこの日々を、ひとつの手帳に。</p><div class="welcome-features"><span>📔 日々の記録</span><span>📈 体重の変化</span><span>🔒 端末内に保存</span></div><button class="save-btn" onclick="addPetForm()">うちのこを登録する</button><button class="secondary" onclick="startDemo()">サンプルで使い方を見る</button><button class="text-button" onclick="triggerImport()">バックアップをお持ちの方はこちら</button><p class="small-note">アカウント登録不要。記録はこのブラウザ内に保存します。<br>大切な記録はファイルにバックアップしてください。</p></section>`;
}
function startDemo(){if(state.pets.length)return;state=seed();state.demo=true;render();}
function finishDemo(){if(!confirm("サンプルの記録を消して、自分のペットを登録しますか？"))return;state={activePet:null,pets:[]};render();addPetForm();}
function editRecord(i){
 const r=pet().records[i];if(!r)return;
 addForm(r.type);editRecordIndex=i;
 document.getElementById("f_date").value=r.date;document.getElementById("f_note").value=r.note;
 if(r.type==="weight")document.getElementById("f_val").value=r.value;
 document.querySelector("#sheet .sheet-h b").textContent=TYPES[r.type].ico+" "+TYPES[r.type].label+"を編集";
 document.getElementById("sheet").insertAdjacentHTML("beforeend",`<button class="danger-link" onclick="deleteRecord(${i})">🗑 この記録を削除</button>`);
}
function recordSummary(r){ const T=TYPES[r.type],dd=jpDate(r.date); return `${T.label}（${dd.md}）`+(r.type==="weight"?` ${r.value}kg`:"")+(r.note?`\n${r.note.slice(0,40)}`:""); }
function deleteRecord(i){
 const p=pet(), r=p.records[i]; if(!r)return;
 if(!confirm("この記録を削除しますか？\n\n"+recordSummary(r)+"\n\n削除すると元に戻せません。"))return;
 p.records.splice(i,1); render(); closeSheet(true); toast("記録を削除しました");
}
function recordMenu(i){
 const r=pet().records[i]; if(!r)return; const T=TYPES[r.type],dd=jpDate(r.date);
 openSheet(`<div class="sheet-h"><b>${T.ico} ${T.label}（${dd.md}）</b><button class="x" onclick="closeSheet()" aria-label="閉じる">✕</button></div>
  <p class="menu-sum">${esc(r.type==="weight"?r.value+"kg":"")}${r.type==="weight"&&r.note?" ／ ":""}${esc(r.note||(r.type==="weight"?"":"メモなし"))}</p>
  <button class="save-btn" onclick="editRecord(${i})">✏️ 編集する</button>
  <button class="secondary danger-text" onclick="deleteRecord(${i})">🗑 削除する</button>
  <button class="text-button" onclick="closeSheet()">キャンセル</button>`);
}
function clearRecSearch(){recQuery="";render();}
function resetRecFilter(){recFilter="all";recQuery="";render();}

/* ---------------- INIT ---------------- */
async function init(){
  // bind tab bar once
  document.querySelectorAll(".tabbar .tab[data-view]").forEach(function(t){
    t.onclick=function(){ setView(t.dataset.view); };
  });
  // migrate old saved state (pre-reminders)
  state.pets.forEach(p=>{
    if(!p.reminders){ p.reminders = p.next?[{id:"r"+Math.random().toString(36).slice(2,8),title:p.next.title,date:p.next.date,place:p.next.place||"",done:false}]:[]; }
  });
  try{ photos=await idbAll(); delete photos.__restore_recovery__; }catch(e){ photos={}; }
  try{
   const media=await idbAll(),pending=media.__restore_pending__;
   if(pending){
    validateState(pending.state);
    if(pending.problem){if(pending.raw!==null)localStorage.setItem(KEY,pending.raw);else localStorage.removeItem(KEY);storageProblem=pending.problem;}
    else{localStorage.setItem(KEY,JSON.stringify(pending.state));persistedState=JSON.stringify(pending.state);state=pending.state;}
    await replacePhotos({...pending.photos,...(media.__restore_recovery__?{__restore_recovery__:media.__restore_recovery__}:{})});
    photos=pending.photos;alert("中断された復元を検出したため、復元前の状態へ戻しました。");
   }
  }catch(e){storageProblem="写真ストレージまたは中断した復元を確認できませんでした。ブラウザの設定を確認し、元データの退避またはバックアップからの復元を選んでください。";}
  render();
  if(!storageProblem&&state.pets.length)checkDue();
}
init();
</script>
